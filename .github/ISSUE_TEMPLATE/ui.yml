name: Schermpunt
description: Een kleine verbetering aan een scherm, tekst of knop.
labels: ["ui"]
body:
  - type: markdown
    attributes:
      value: |
        **Deze repository is openbaar: zet hier geen persoons- of medische
        gegevens.** Dus geen namen, BSN's, geboortedata, adressen, diagnoses,
        medicatie of recepten, geen back-ups of exports, en geen
        schermafbeeldingen waar echte gegevens op staan. Gebruik alleen
        verzonnen testgegevens.
  - type: input
    id: scherm
    attributes:
      label: Welk scherm?
      placeholder: Meer → Back-up
    validations:
      required: true
  - type: textarea
    id: nu
    attributes:
      label: Wat zie je nu?
    validations:
      required: true
  - type: textarea
    id: gewenst
    attributes:
      label: Wat wil je zien?
    validations:
      required: true
  - type: dropdown
    id: onderdeel
    attributes:
      label: Onderdeel
      options:
        - Inrichten en ontgrendelen
        - Vergrendelen
        - Back-up
        - Logboek
        - Instellingen
        - Installatie en update
        - Voorschrijver
        - Patiënten
        - Recepten
        - Anders
    validations:
      required: true
  - type: textarea
    id: afbeelding
    attributes:
      label: Schermafbeelding (optioneel)
      description: Alleen van een scherm met verzonnen testgegevens.
  - type: input
    id: versie
    attributes:
      label: Versie
      placeholder: 0.3.1
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Ik heb gecontroleerd dat dit issue geen persoons- of medische gegevens bevat, ook niet in een schermafbeelding.
          required: true
