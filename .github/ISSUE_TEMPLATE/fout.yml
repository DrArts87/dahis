name: Fout melden
description: Iets in Dahis werkt niet zoals je verwacht.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Deze repository is openbaar: zet hier geen persoons- of medische
        gegevens.** Dus geen namen, BSN's, geboortedata, adressen, diagnoses,
        medicatie of recepten, geen back-ups of exports, en geen
        schermafbeeldingen waar echte gegevens op staan. Gebruik alleen
        verzonnen testgegevens.

        Een beveiligingslek meld je niet hier, maar via *Security* → *Report a vulnerability*.
  - type: textarea
    id: wat-gebeurde
    attributes:
      label: Wat gebeurde er?
      description: Beschrijf kort wat je zag.
    validations:
      required: true
  - type: textarea
    id: verwacht
    attributes:
      label: Wat verwachtte je?
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Stappen om het na te doen
      description: Zo precies mogelijk, met verzonnen gegevens.
      placeholder: |
        1. Open Meer → ...
        2. Tik op ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: onderdeel
    attributes:
      label: Onderdeel
      options:
        - Inrichten en ontgrendelen
        - Vergrendelen
        - Back-up
        - Logboek
        - Instellingen
        - Installatie en update
        - Voorschrijver
        - Patiënten
        - Recepten
        - Anders
    validations:
      required: true
  - type: input
    id: versie
    attributes:
      label: Versie en codehash
      description: Te vinden onder Meer → Over deze app. De eerste 8 tekens van de codehash zijn genoeg.
      placeholder: 0.3.1, f4fe0deb
    validations:
      required: true
  - type: input
    id: toestel
    attributes:
      label: Toestel en browser
      placeholder: OnePlus 13R, Chrome
  - type: textarea
    id: foutmelding
    attributes:
      label: Foutmelding
      description: Letterlijke tekst uit de app. Haal er eerst alles uit dat naar een persoon te herleiden is.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Ik heb gecontroleerd dat dit issue geen persoons- of medische gegevens bevat, ook niet in een schermafbeelding.
          required: true
