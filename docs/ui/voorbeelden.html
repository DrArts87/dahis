<header class="page-head">
  <h1>Dahis: voorbeeldschermen (taak 5)</h1>
  <p>Statische voorbeelden ter afstemming, met verzonnen tekst en zonder namen. Niets hiervan
  werkt en niets wordt gepubliceerd. De herstelsleutel is een voorbeeld en geen echte sleutel.
  Licht of donker volgt de instelling van je toestel.</p>
</header>

<figure class="phone brand-fig"><div class="brand">
  <div class="dark"><svg><use href="#logo-w"/></svg></div>

</div><div class="brand"><div class="icon-sq"><svg><use href="#logo-w"/></svg></div></div>
<figcaption>0. Logo: donker, licht en als app-icoon</figcaption></figure>
<figure class="phone"><div class="screen">
<div class="top"><img class="fern" src="varen-mos.png" alt=""><div class="row"><span class="spacer"></span></div><h1>Welkom</h1><div class="sub">Stap 1 van 5</div></div><main>
<p>Dahis bewaart je gegevens versleuteld op dit toestel. Niets gaat naar internet.</p>
<div class="card"><h3>Je kiest zo</h3>
<p>1. een wachtwoord om de app te openen;<br>2. een herstelsleutel op papier, voor als je het wachtwoord vergeet.</p>
<p class="muted">Zonder wachtwoord én zonder herstelsleutel kan niemand je gegevens terughalen, ook de maker niet.</p></div>
<button class="btn primary">Beginnen</button></main><img class="canopy" src="varen-blad.png" alt="">
</div><figcaption>1. Welkom en uitleg</figcaption></figure>
<figure class="phone"><div class="screen">
<div class="top"><img class="fern" src="varen-mos.png" alt=""><div class="row"><span class="back"><svg class="icon"><use href="#i-back"/></svg>Terug</span><span class="spacer"></span></div><h1>Wachtwoord</h1><div class="sub">Stap 2 van 5</div></div><main>
<p class="muted">Minimaal 14 tekens. Tip: een zin van vijf losse woorden, zoals “lantaarn mos rivier kompas zomer”. Gebruik die niet zelf.</p>
<label for="p1">Wachtwoord</label><input id="p1" type="password" value="xxxxxxxxxxxxxxxxxxxx">
<div class="meter"><span></span></div><p class="hint">20 tekens. Voldoet.</p>
<label for="p2">Nog een keer</label><input id="p2" type="password" value="xxxxxxxxxxxxxxxxxxxx"><p class="hint">Komt overeen.</p>
<button class="btn primary">Verder</button></main>
</div><figcaption>2. Wachtwoord kiezen</figcaption></figure>
<figure class="phone"><div class="screen">
<div class="top"><img class="fern" src="varen-mos.png" alt=""><div class="row"><span class="spacer"></span></div><h1>Herstelsleutel</h1><div class="sub">Stap 3 van 5</div></div><main>
<p>Schrijf deze sleutel op papier en bewaar hem op een veilige plek, niet bij de telefoon.</p>
<div class="key"><span>7K3M</span><span>Q9TD</span><span>2HXA</span><span>VR8N</span><span>C4PW</span><span>E61J</span><span>ZB5S</span><span>M0YG</span><span>K7FD</span><span>H2QT</span><span>9WNC</span><span>X3RP</span><span>A8VE</span><span>4JKM</span></div>
<p class="hint">Voorbeeld, geen echte sleutel. 14 groepen; de laatste groep is een controle op tikfouten.</p>
<div class="warn">Maak geen foto of screenshot: die kan in een cloud-back-up terechtkomen.</div>
<button class="btn primary">Ik heb hem opgeschreven</button></main>
</div><figcaption>3. Herstelsleutel tonen</figcaption></figure>
<figure class="phone"><div class="screen">
<div class="top"><img class="fern" src="varen-mos.png" alt=""><div class="row"><span class="spacer"></span></div><h1>Controle</h1><div class="sub">Stap 4 van 5</div></div><main>
<p>Typ twee groepen over van je papier.</p>
<label for="g1">Groep 5</label><input id="g1" type="text" value="C4PW">
<label for="g2">Groep 11</label><input id="g2" type="text" value="">
<p class="hint">Hoofd- of kleine letters maakt niet uit.</p>
<button class="btn primary">Controleren</button><button class="btn link">Sleutel nog eens tonen</button></main>
</div><figcaption>4. Herstelsleutel controleren</figcaption></figure>

<div class="card"><dl>
<dt>Opslag</dt><dd>Versleuteld, beschermd tegen opruimen</dd>
<dt>Ontgrendelen</dt><dd>Duurt op dit toestel ongeveer 0,8 s</dd>
<dt>Vergrendelen</dt><dd>Na 3 minuten niets doen, en bij wisselen van app</dd></dl></div>
<div class="warn">Er is nog geen back-up. Die functie komt in een volgende versie. Tot dan alleen testgegevens gebruiken.</div>
<button class="btn primary">Naar de app</button></main><img class="canopy" src="varen-blad.png" alt="">
